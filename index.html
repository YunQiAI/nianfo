<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>念佛计数器 - 语音识别版</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header-section" id="headerSection">
            <h1>念佛计数器</h1>
            <p class="subtitle">语音识别自动计数</p>
        </div>
        
        <div class="focus-toggle">
            <button id="focusBtn" class="btn btn-focus">专注模式</button>
        </div>
        
        <div class="main-layout">
            <div class="left-panel" id="leftPanel">
                <div class="mode-selector">
                    <button id="speechModeBtn" class="btn btn-mode">语音识别</button>
                    <button id="keyboardModeBtn" class="btn btn-mode active">木鱼模式</button>
                </div>
                
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-text">准备就绪</span>
                </div>
                
                <div class="controls" id="speechControls" style="display: none;">
                    <button id="startBtn" class="btn btn-primary">开始识别</button>
                    <button id="stopBtn" class="btn btn-secondary" disabled>停止识别</button>
                    <button id="resetBtn" class="btn btn-danger">重置计数</button>
                </div>
                
                <div class="controls" id="keyboardControls">
                    <div class="keyboard-mode-selector">
                        <button id="charModeBtn" class="btn btn-sub-mode active">按字敲击</button>
                        <button id="chantModeBtn" class="btn btn-sub-mode">按佛号敲击</button>
                    </div>
                    <div class="keyboard-hint" id="keyboardHint">按任意键敲击木鱼</div>
                    <div class="keyboard-progress" id="keyboardProgress" style="display: none;">
                        <div class="progress-text">进度: <span id="progressText">0/4</span></div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                    <button id="resetBtn2" class="btn btn-danger">重置计数</button>
                </div>
                
                <div class="count-display">
                    <div class="count-label">阿弥陀佛</div>
                    <div class="count-number" id="amitabhaCount">0</div>
                </div>
            </div>
            
            <div class="center-panel">
                <div class="buddha-image-container">
                    <img src="amituofo.jpg" alt="阿弥陀佛" class="buddha-image">
                </div>
                <div class="combo-container" id="comboContainer"></div>
            </div>
            
            <div class="right-panel" id="rightPanel">
                <div class="recognition-info" id="recognitionInfo"></div>
                <div class="last-recognized" id="amitabhaLast"></div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
