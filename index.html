<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>念佛计数器 - 语音识别版</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>念佛计数器</h1>
        <p class="subtitle">语音识别自动计数</p>
        
        <div class="buddha-image-container">
            <img src="amituofo.jpg" alt="阿弥陀佛" class="buddha-image">
        </div>
        
        <div class="status-indicator" id="statusIndicator">
            <span class="status-text">准备就绪</span>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">开始识别</button>
            <button id="stopBtn" class="btn btn-secondary" disabled>停止识别</button>
            <button id="resetBtn" class="btn btn-danger">重置计数</button>
        </div>
        
        <div class="chants-container">
            <div class="chant-card main-card">
                <h2>阿弥陀佛</h2>
                <div class="count" id="amitabhaCount">0</div>
                <div class="last-recognized" id="amitabhaLast"></div>
                <div class="recognition-info" id="recognitionInfo"></div>
            </div>
        </div>
        
        <div class="total-section">
            <h3>总计数：<span id="totalCount">0</span></h3>
        </div>
        
        <div class="transcript-section">
            <h3>识别记录</h3>
            <div id="transcript" class="transcript"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
